# Profile repo — Rupali59/Rupali59.
#
# This is a PROJECT of the Rupali workspace, not a workspace itself: no
# `workspace: true`, no `propagation/` folder. Its ledger is the one at
# Rupali/propagation/.
#
# WHY THIS EDGE EXISTS, stated so it is not re-litigated:
# On 2026-08-25 this repo held three descriptions of one career — the published
# README.md, an unpublished docs/unreviewed/README.md that was BETTER than the
# published one, and Rupali_Resume.pdf. Plus LinkedIn, off-repo. They disagreed
# on the NowFloats end date (Jul vs Aug 2018), on academic scores (percentages
# vs CGPA), and on which metrics existed at all. Nothing could notice, because
# nothing declared that they had to agree.
#
# docs/unreviewed/README.md is gone (harvested into README.md). The PDF stays,
# so the coupling stays, so it gets declared.

sources:
  README.md:
    propagates_to:
      - path: resume/Rupali_Bhatnagar_Resume.pdf
        why: >-
          the PDF resume and the profile README state the same career. They
          silently diverged on dates, scores and three metrics because nothing
          coupled them. Repointed 2026-10-21 when the root Rupali_Resume.pdf was
          deleted: resume/ holds the one remaining copy
        kind: prose
      - path: resume/resume.html
        why: >-
          the README and the HTML resume state the same career from the same
          facts. Measured 2026-08-29: three figures had already diverged
          (go.work modules, Go files, test files) because the HTML was copied
          from the README once and neither side could see the other after that
        kind: prose

# ADDED 2026-08-29, and it is the same failure one directory down.
# The block above records three descriptions of one career that diverged
# because nothing declared they had to agree. On 2026-08-29 a FOURTH and FIFTH
# appeared — resume/resume.html and the PDF it renders to — untracked and
# undeclared, so `check --changed` on the commit that created them reported
# nothing. That green was "not looking", not "clean".
#
# It had already cost something measurable. resume/resume.html carried
# "36 go.work modules, 702 Go files" and "130 test files", copied from
# README.md; measured that day they were 25 / 698 / 143. README.md still
# carries the stale pair. That is the edge below, in the direction it failed.
#
# RESOLVED 2026-10-21: there were two PDFs of one resume, Rupali_Resume.pdf
# (root) and resume/Rupali_Bhatnagar_Resume.pdf. Rupali chose one copy; the
# root file was deleted and resume/ is canonical. No edge between them is
# needed because only one exists.

  resume/resume.html:
    propagates_to:
      - path: resume/Rupali_Bhatnagar_Resume.pdf
        why: >-
          the PDF is a headless-Chrome render of this HTML and holds no content
          of its own, so it is stale from the moment the HTML changes without a
          re-render — and nothing about the PDF looks stale when it is
        kind: prose

# ADDED 2026-08-29, alongside docs/COMPONENTS.md.
#
# The two blocks above are the same failure twice: descriptions of one career
# that diverged because nothing declared they had to agree. This block is the
# same failure a third time, in the other direction — docs/REPO-CATALOG.md was
# added that day carrying findings that CONTRADICT the published claims (a
# WebAuthn/OTP/JWT row for a codebase where all four packages are declared and
# never imported), and it was declared here in neither direction. So the
# correction sat in the repository, correct and unreachable, while the resume
# rendered the false claim to PDF.
#
# docs/COMPONENTS.md is the concept-level view of that same source reading. It
# is the file the resume and the README are actually written FROM, so that is
# the edge, in the direction it failed.
#
# NOT declared, deliberately: docs/COMPONENTS.md -> docs/REPO-CATALOG.md. They
# describe the same work through different instruments — one concepts, one
# counts — and neither is downstream of the other. Coupling them would assert a
# precedence that does not exist and would fire on every regeneration of the
# counts, which change weekly by design.

  docs/COMPONENTS.md:
    propagates_to:
      - path: README.md
        why: >-
          the profile README's project rows are the published short form of
          these sections. When a concept here is corrected by re-reading source
          — as the WebAuthn claim was on 2026-08-29 — the README is the file
          that still carries the old version, and nothing else would notice
        kind: prose
      - path: resume/resume.html
        why: >-
          the HTML resume states the same projects from the same source
          reading, and it is the side that renders to PDF. A claim corrected
          here and not there becomes a false statement in a document that
          leaves the building
        kind: prose
